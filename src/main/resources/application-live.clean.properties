# ============================================================================
# ALGO TRADING V2 - CLEAN VALIDATION CONFIGURATION
# ============================================================================
# Replace all REPLACE_ME values before deployment.
# Keep the completed live file outside source control.

# ----------------------------------------------------------------------------
# ANGEL ONE / SMARTAPI
# ----------------------------------------------------------------------------
broker.client.id=REPLACE_ME
broker.pin=REPLACE_ME
broker.totp.secret=REPLACE_ME
broker.api.key=REPLACE_ME

# ----------------------------------------------------------------------------
# TRADING MODE
# ----------------------------------------------------------------------------
# Keep PAPER until walk-forward results are profitable after costs and the
# execution ledger has been verified. Change explicitly for a later live rollout.
# paper | live
trading.mode=paper

# ----------------------------------------------------------------------------
# RISK MANAGEMENT - RS 5,00,000 CAPITAL
# ----------------------------------------------------------------------------
risk.capital=500000

# 0.55% = Rs 2,750 planned risk per trade
risk.per.trade=0.0055

# 2% = Rs 10,000 maximum daily loss
risk.max.daily.loss=0.02

# 4.6% = Rs 23,000 daily profit target
risk.max.daily.profit=0.046

risk.reward.ratio=3.0
risk.tsl.trail.pct=0.01
risk.max.trades.day=15
# Three simultaneous trades risk at most Rs 8,250 before charges/slippage.
risk.max.open.positions=3

# 5% = Rs 25,000 position allocation. Skip the trade when two lots do not fit.
risk.max.position.size=0.05

# Estimated all-in charges/slippage booked into runtime daily risk per close.
# Recalibrate monthly from the broker contract notes.
risk.estimated.cost.per.closed.trade=150
risk.halt.on.protective.sl.failure=true

# ----------------------------------------------------------------------------
# CANDLES, STRATEGY LOOP, AND HISTORICAL REFRESH
# ----------------------------------------------------------------------------
candle.timeframe=FIVE_MINUTE
candle.history.bars=20000
strategy.loop.settle.seconds=5

trading.live.historical.refresh.enabled=true
trading.live.historical.refresh.overlap.bars=3
trading.live.historical.refresh.fallback.only=true
trading.live.historical.refresh.max.symbols.per.cycle=1
trading.live.historical.refresh.sleep.ms=1500
trading.live.historical.refresh.cooldown.minutes=15

# ----------------------------------------------------------------------------
# ORDER EXECUTION AND BROKER SAFETY
# ----------------------------------------------------------------------------
order.protected.limit=true
order.limit.wait.seconds=15

order.product.type=NRML
order.product.type.intraday=INTRADAY
order.product.type.delivery.equity=DELIVERY
order.product.type.delivery.derivatives=NRML

order.broker.flat.entry.cooldown.seconds=300
order.broker.funds.check.enabled=true
order.broker.orderbook.failure.cooldown.seconds=60
order.margin.calculator.enabled=true
order.margin.buffer.rs=1000
telegram.safety.alert.cooldown.seconds=300
trading.intraday.position.guard.seconds=60

# ----------------------------------------------------------------------------
# DEFAULT INSTRUMENT SETTINGS
# ----------------------------------------------------------------------------
# EQUITY | FUTURES | OPTION_BUY | OPTION_WRITE
trading.instrument.type=FUTURES
trading.equity.exchange=NSE

trading.futures.expiry.offset=0
trading.futures.lots=1

trading.option.expiry.offset=0
trading.option.strike.offset=0
trading.option.lots=2

# Option BUY entry and exit plan.
# With sl.pct=0, max.loss is a fixed rupee loss per trade.
trading.option.buy.entry.discount.pct=0
trading.option.buy.max.loss=2000
trading.option.buy.sl.pct=0
trading.option.buy.tp.pct=0
trading.option.buy.tsl.trigger.step.pct=0.02
trading.option.buy.tsl.stop.step.pct=0.01

# Option WRITE caps per trade.
trading.option.write.max.profit=6000
trading.option.write.max.loss=3000

# ----------------------------------------------------------------------------
# VWAP + SUPERTREND + RSI (PAPER RESEARCH CANDIDATE)
# ----------------------------------------------------------------------------
strategy.vsrsi.enabled=true
strategy.vsrsi.trade.type=LONG
strategy.vsrsi.holding.type=INTRADAY
strategy.vsrsi.instrument.type=FUTURES
strategy.vsrsi.futures.expiry.offset=0
strategy.vsrsi.futures.lots=1
strategy.vsrsi.option.expiry.offset=0
strategy.vsrsi.option.strike.offset=0
strategy.vsrsi.option.lots=1
strategy.vsrsi.atr.period=10
strategy.vsrsi.atr.multiplier=3.0
strategy.vsrsi.supertrend.mode=REAL
strategy.vsrsi.require.fresh.signal=true
strategy.vsrsi.rsi.period=14
strategy.vsrsi.rsi.bull.low=40
strategy.vsrsi.rsi.bull.high=70
strategy.vsrsi.rsi.bear.low=30
strategy.vsrsi.rsi.bear.high=60
strategy.vsrsi.entry.start=09:30
strategy.vsrsi.entry.cutoff=14:30

# ----------------------------------------------------------------------------
# MULTI-INDICATOR CONFLUENCE STRATEGY - MICS (QUARANTINED, OPTION BUY)
# ----------------------------------------------------------------------------
strategy.mics.enabled=false
strategy.mics.ema.fast=10
strategy.mics.ema.slow=30
strategy.mics.rsi.period=14
strategy.mics.rsi.bull.low=50
strategy.mics.rsi.bull.high=70
strategy.mics.rsi.bear.low=30
strategy.mics.rsi.bear.high=50
strategy.mics.macd.short=12
strategy.mics.macd.long=26
strategy.mics.macd.signal=9
strategy.mics.bb.period=20
strategy.mics.bb.k=2.0
strategy.mics.bb.squeeze.threshold=0.005
strategy.mics.atr.period=14
strategy.mics.atr.stop.multiplier=1.5
strategy.mics.hedge.option.threshold=0.02
strategy.mics.hedge.spread.threshold=0.03
strategy.mics.entry.start=09:30
strategy.mics.entry.cutoff=13:30
strategy.mics.min.confluence.score=4
strategy.mics.use.vwap.gate=true
strategy.mics.adx.period=14
strategy.mics.adx.threshold=22
strategy.mics.vol.spike.ratio=1.2
strategy.mics.vol.avg.period=20
strategy.mics.trade.type=LONG
strategy.mics.holding.type=INTRADAY

# ----------------------------------------------------------------------------
# MOMENTUM SCALPING (QUARANTINED, OPTION BUY)
# ----------------------------------------------------------------------------
strategy.scalping.enabled=false
strategy.scalping.ema.fast=9
strategy.scalping.ema.slow=21
strategy.scalping.rsi.period=14
strategy.scalping.rsi.bull=55
strategy.scalping.rsi.bear=45
strategy.scalping.macd.fast=12
strategy.scalping.macd.slow=26
strategy.scalping.macd.signal=9
strategy.scalping.atr.period=14
strategy.scalping.atr.stop.multiplier=1.5
strategy.scalping.atr.min.pct=0.0005
strategy.scalping.opening.range.minutes=15
strategy.scalping.swing.lookback=10
strategy.scalping.volume.avg.period=20
strategy.scalping.volume.spike.ratio=1.2
strategy.scalping.entry.start=09:20
strategy.scalping.entry.cutoff=13:30
strategy.scalping.require.15m.bias=true

# ----------------------------------------------------------------------------
# SMC LIQUIDITY SWEEP (QUARANTINED, OPTION BUY)
# ----------------------------------------------------------------------------
strategy.smc.enabled=false
strategy.smc.atr.period=14
strategy.smc.atr.stop.multiplier=1.5
strategy.smc.liquidity.lookback=20
strategy.smc.sweep.recent.bars=5
strategy.smc.swing.lookback=10
strategy.smc.equal.level.atr.tolerance=0.15
strategy.smc.fvg.min.atr.pct=0.10
strategy.smc.volume.avg.period=20
strategy.smc.volume.spike.ratio=1.2
strategy.smc.entry.start=09:20
strategy.smc.entry.cutoff=13:30

# ----------------------------------------------------------------------------
# MA CROSSOVER (AVAILABLE)
# ----------------------------------------------------------------------------
strategy.ma.trade.type=BOTH
strategy.ma.holding.type=INTRADAY
strategy.ma.fast=10
strategy.ma.slow=30
strategy.ma.type=EMA

# ----------------------------------------------------------------------------
# RSI STRATEGY (AVAILABLE)
# ----------------------------------------------------------------------------
strategy.rsi.trade.type=BOTH
strategy.rsi.holding.type=INTRADAY
strategy.rsi.period=14
strategy.rsi.oversold=30
strategy.rsi.overbought=70

# ----------------------------------------------------------------------------
# BACKTEST VALIDATION
# ----------------------------------------------------------------------------
backtest.respect.watchlist.routing=true
# Conservative per-round-trip proxy based on the supplied trade statement.
# Replace with exact brokerage, taxes, exchange fees and measured slippage.
backtest.fixed.cost.per.trade=150
backtest.round.trip.cost.bps=0

# ----------------------------------------------------------------------------
# DATABASE
# ----------------------------------------------------------------------------
db.url=jdbc:postgresql://localhost:5432/algo_db_v2
db.username=algo
db.password=REPLACE_ME
db.pool.max=10
db.pool.min=2
db.pool.timeout=30000

# ----------------------------------------------------------------------------
# TELEGRAM
# ----------------------------------------------------------------------------
telegram.enabled=true
telegram.bot.token=REPLACE_ME
telegram.chat.id=REPLACE_ME

# ----------------------------------------------------------------------------
# SMARTSTREAM FEED
# ----------------------------------------------------------------------------
feed.type=SMARTSTREAM
feed.mode=QUOTE
feed.stale.reconnect.seconds=180
angel.smartstream.price.scale=100

# ----------------------------------------------------------------------------
# MARKET SESSION - IST
# ----------------------------------------------------------------------------
market.open=09:15
market.close=15:30
market.squareoff=15:15

# ----------------------------------------------------------------------------
# HEALTH DASHBOARD
# ----------------------------------------------------------------------------
health.enabled=true
health.port=8080
